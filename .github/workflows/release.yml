name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v4.2.1
        with:
          cache_key: "mise-{{platform}}-{{version}}-{{file_hash}}"
          version: "2026.3.1"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols

      - run: just install
      - run: just lint
      - run: just test
      - run: just build
      - run: just package

      # The .app bundles are directories, so zip them; the rest only
      # need release-friendly names.
      - name: Stage release artifacts
        run: |
          (cd dist/darwin-amd64 && zip -r --symlinks ../proton-drive-photos-export-darwin-amd64.zip ./*.app)
          (cd dist/darwin-arm64 && zip -r --symlinks ../proton-drive-photos-export-darwin-arm64.zip ./*.app)
          mv dist/linux-amd64/*.tar.xz dist/proton-drive-photos-export-linux-amd64.tar.xz
          mv dist/windows-amd64/*.exe dist/proton-drive-photos-export-windows-amd64.exe

      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/proton-drive-photos-export-*

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/proton-drive-photos-export-*
