name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: extractions/setup-just@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev
          sudo wget -qO /usr/local/bin/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-Linux-x86_64
          sudo chmod +x /usr/local/bin/hadolint

      - run: just install
      - run: just lint
      - run: just test
      - run: just build
      - run: just package

      # The .app bundles are directories, so zip them; the rest only
      # need release-friendly names.
      - name: Stage release artifacts
        run: |
          (cd dist/darwin-amd64 && zip -r --symlinks ../photos-export-proton-drive-darwin-amd64.zip ./*.app)
          (cd dist/darwin-arm64 && zip -r --symlinks ../photos-export-proton-drive-darwin-arm64.zip ./*.app)
          mv dist/linux-amd64/*.tar.xz dist/photos-export-proton-drive-linux-amd64.tar.xz
          mv dist/windows-amd64/*.exe dist/photos-export-proton-drive-windows-amd64.exe

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/photos-export-proton-drive-*
