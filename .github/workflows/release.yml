# AI GENERATED - Tom Barone
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: Test
        run: go test ./...

      # fyne package cannot build universal macOS binaries itself, so
      # build both architectures, merge with lipo and package the result.
      - name: Package (macOS universal)
        if: runner.os == 'macOS'
        run: |
          CGO_ENABLED=1 GOARCH=amd64 go build -o photos-export-amd64 .
          CGO_ENABLED=1 GOARCH=arm64 go build -o photos-export-arm64 .
          lipo -create -output photos-export-universal photos-export-amd64 photos-export-arm64
          go tool fyne package --os darwin --exe photos-export-universal --release
          ditto -c -k --keepParent "Photos Export for Proton Drive.app" \
            photos-export-proton-drive-macos-universal.zip

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          go tool fyne package --os windows --release
          mv "Photos Export for Proton Drive.exe" photos-export-proton-drive-windows-amd64.exe

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          go tool fyne package --os linux --release
          mv "Photos Export for Proton Drive.tar.xz" photos-export-proton-drive-linux-amd64.tar.xz

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            photos-export-proton-drive-*.zip
            photos-export-proton-drive-*.exe
            photos-export-proton-drive-*.tar.xz
